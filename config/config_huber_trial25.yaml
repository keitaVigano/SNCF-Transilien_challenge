# Same architecture as the winning Optuna trial (#24, loss=mae, val MAE=0.6931
# at full budget -- see config.yaml), but with trial #25's hyperparameters
# (loss=huber, huber_beta=0.257) -- the closest huber trial in
# models/optuna/20260921_232919, which only got 60 epochs/patience 15 there
# (best val MAE=0.7029). This gives huber the same full 150-epoch/patience-25
# budget mae already had, to compare fairly instead of on the tuning sweep's
# short budget.

seed: 42

data:
  x_train_path: x_train_final.csv
  y_train_path: y_train_final_j5KGWWK.csv
  x_test_path: x_test_final.csv
  target_col: p0q0
  categorical_cols: [gare]
  numeric_cols: [arret, p2q0, p3q0, p4q0, p0q2, p0q3, p0q4]
  date_col: date
  use_date_features: true
  val_fraction: 0.2
  num_workers: 0

model:
  embedding_dim: 16
  hidden_dim: 256
  activation: sigmoid
  hidden_init: uniform
  hidden_init_range: [-1.0, 1.0]

train:
  solver: sgd
  batch_size: 4096
  epochs: 150
  lr: 0.013395730063944492
  optimizer: adam
  weight_decay: 3.364759362089991e-05
  ridge_lambda: 1.0
  loss: huber
  huber_beta: 0.2574535834999205
  device: auto
  early_stopping_patience: 25
  use_tensorboard: true

output:
  models_dir: models
  predictions_filename: predictions.csv

tune:
  n_trials: 30
  epochs_per_trial: 60
  early_stopping_patience_per_trial: 15
  study_name: selm_tuning
  fixed_loss: huber
