# Best SELM config (mae loss, val MAE=0.6931 in models/20260922_183608),
# rerun after dropping rows with |p0q0| > 20 min -- see analysis/error_analysis.py:
# that threshold is the bucket boundary where MAE explodes from ~2 min to
# ~40 min (the "(20.0, inf)" bucket), dominated by the 2023-11-10 network-wide
# event and a handful of other one-off extreme delays scattered on other
# dates. Both train AND val are filtered (see main.py:load_datasets), so this
# answers "how good is the model on the learnable, non-disruption cases",
# not the real-world metric including disruptions.

seed: 42

data:
  x_train_path: x_train_final.csv
  y_train_path: y_train_final_j5KGWWK.csv
  x_test_path: x_test_final.csv
  target_col: p0q0
  categorical_cols: [gare]
  numeric_cols: [arret, p2q0, p3q0, p4q0, p0q2, p0q3, p0q4]
  date_col: date
  use_date_features: true
  val_fraction: 0.2
  num_workers: 0
  max_abs_target: 20

model:
  embedding_dim: 16
  hidden_dim: 256
  activation: sigmoid
  hidden_init: uniform
  hidden_init_range: [-1.0, 1.0]

train:
  solver: sgd
  batch_size: 4096
  epochs: 150
  lr: 0.012450579334097437
  optimizer: adam
  weight_decay: 4.181043148886732e-05
  ridge_lambda: 1.0
  loss: mae
  huber_beta: 1.0
  device: auto
  early_stopping_patience: 25
  use_tensorboard: true

output:
  models_dir: models
  predictions_filename: predictions.csv

tune:
  n_trials: 30
  epochs_per_trial: 60
  early_stopping_patience_per_trial: 15
  study_name: selm_tuning
  fixed_loss: huber
