[project]
name = "delays"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saraborello", email = "saraaborello@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "category-encoders==2.8.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy==1.26.4",
    "optuna>=5.0.0",
    "pandas==2.2.3",
    "pyarrow>=25.0.1",
    "scikit-learn==1.7.2",
    "shap>=0.49.1",
    "xgboost==3.1.3",
]

[project.scripts]
delays = "delays.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
